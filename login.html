<!doctype html>
<html lang="zxx">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Cyber Hacking Breaches Prediction and Detection Using Machine Learning</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="../static/css/bootstrap.min.css">
    <!-- animate CSS -->
    <link rel="stylesheet" href="../static/css/animate.css">
    <!-- owl carousel CSS -->
    <link rel="stylesheet" href="../static/css/owl.carousel.min.css">
    <!-- font awesome CSS -->
    <link rel="stylesheet" href="../static/css/all.css">
    <!-- flaticon CSS -->
    <link rel="stylesheet" href="../static/css/flaticon.css">
    <link rel="stylesheet" href="../static/css/themify-icons.css">
    <!-- font awesome CSS -->
    <link rel="stylesheet" href="../static/css/magnific-popup.css">
    <!-- swiper CSS -->
    <link rel="stylesheet" href="../static/css/slick.css">
    <!-- style CSS -->
    <link rel="stylesheet" href="../static/css/login.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f4b5c, #1d707f);
            background-image: url(../static/img/loginimage.webp);
            background-size: cover;
            color: #fff;
        }
        
        /* Navigation Bar Styles */
        nav {
            display: flex;
            justify-content: center;
            background-color: #333;
            padding: 10px;
        }
        
        nav a {
            color: white;
            padding: 14px 20px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
        }
        
        nav a:hover {
            background-color: #00d9d9;
            border-radius: 5px;
        }

        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
        
        .login-container h3 {
            text-align: center;
            color: #00d9d9;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
        }
        
        .form-control {
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid #00d9d9;
            color: #fff;
            border-radius: 5px;
            padding: 12px;
        }
        
        .form-control::placeholder {
            color: #fff;
        }
        
        .btn-primary {
            background: #00d9d9;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-weight: bold;
        }
        
        .btn-primary:hover {
            background: #00a6a6;
        }
    </style>
</head>

<body>
    <!-- Navigation Bar -->
    <nav>
        <a href="/">Home</a> <!-- Link to Home -->
        <a href="#login">Login</a> <!-- Link to Login (you can update this to the correct login route) -->
        <a href="/upload">Upload</a> <!-- Link to Upload -->
    </nav>

    <div class="login-container">
        <h3>Cyber Security Login</h3>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="uname" class="form-control" placeholder="Enter Username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="pwd" class="form-control" placeholder="Enter Password">
        </div>
        <button class="btn btn-primary btn-block" onclick="login()">Login</button>
    </div>

    <script>
        function login() {
            var uname = document.getElementById("uname").value;
            var pwd = document.getElementById("pwd").value;

            if (uname == "admin" && pwd == "admin") {
                alert("Login Success!");
                window.location = "{{url_for('upload')}}";
            } else {
                alert("Invalid Credentials!");
            }
        }
    </script>
</body>

</html>
